name: Build & Deploy Launcher

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
  pull_request:

jobs:
  check:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Install Chromium for the rendering tests
        run: pnpm exec playwright install --with-deps chromium

      - name: Test
        run: pnpm run test

  build:
    name: Build (${{ matrix.os }})
    needs: check
    runs-on: ${{ matrix.os }}
    # pnpm/action-setup 6.1 leaves a broken pnpm.cmd shim on Windows after its pnpm 11 → 12
    # self-update, so PowerShell steps cannot run pnpm (pnpm/action-setup#291); bash can.
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            cmd: build:linux
            artifact_name: build-linux
          - os: windows-latest
            cmd: build:win
            artifact_name: build-windows
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Set NODE_ENV to production
        run: sed -i 's/NODE_ENV=development/NODE_ENV=production/' .env

      - name: Build
        run: pnpm run ${{ matrix.cmd }}

      - name: Upload Linux artifacts
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            release/*.AppImage
            release/*.rpm
            release/*.deb
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 1 || 7 }}

      - name: Upload Windows artifacts
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: release/*.exe
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 1 || 7 }}

  release:
    name: Create GitHub Release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Linux artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-linux
          path: artifacts/

      - name: Download Windows artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-windows
          path: artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/*.exe
            artifacts/*.AppImage
            artifacts/*.rpm
            artifacts/*.deb
